[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcc-impact-copilot"
version = "0.1.0"
description = "Agentic impact monitoring for public-goods grant portfolios"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Sipeng Xie" }
]
dependencies = []

[project.scripts]
gcc-impact = "gcc_impact_copilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
